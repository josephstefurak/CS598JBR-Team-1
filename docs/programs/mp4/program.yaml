reserved_blocks: []               # no ordered namespaces in this repo

verification_floor:               # run every phase, in addition to the phase's own checks
  - python3 -I -m py_compile MP4/src/*.py            # once MP4/src exists (M2+)
  - python3 -I MP4/src/selftest.py                   # once it exists (M2+); record PASS count and delta
  - python3 -I MP4/src/scrub_secrets.py --check MP4/ # once it exists (M2+)
  - python3 -I MP4/src/run_pipeline.py --help        # once it exists (M2+)
  - python3 -I MP4/src/run_pipeline.py --check-only --project project_1   # once translations exist (M6+)
  - python3 -I MP4/src/run_pipeline.py --check-only --project project_2   # once translations exist (M7+)
  - python3 -I MP4/src/integrity.py --provenance project_1                # M6+
  - python3 -I MP4/src/integrity.py --provenance project_2                # M7+
  - git grep -nE 'sk-ant-|Bearer |api_key=' -- MP4/ docs/  # must print nothing
  - git status --short                                     # must be clean after the phase commit

