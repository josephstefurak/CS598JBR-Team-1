standing_priorities:
  - The generated Rust under MP4/translations/ is never edited by a human or by an agent-A session. Only prompts and orchestration change, every change logged in MP4/configs/CHANGELOG.md, then the pipeline reruns.
  - Every number in README, results and report is generated from committed artifacts and reproducible with `run_pipeline.py --check-only`; nothing is typed in by hand or invented.
  - Benchmark tests, interfaces, Cargo.toml and Cargo.lock are immutable and guarded by checksums in code, not prose.
  - Owner-blocked work (course unsafe-metrics tool, course validation script, Overleaf, merge/push) stays in rows M12-M14; nothing earlier waits on it.
  - Trajectories are complete, per-iteration, scrubbed of secrets, emails and home paths, and prove the loop was feedback-driven.

owner_gates:
  - Installing software on the owner's machine (rustup, toolchain): exact commands shown first, in-session yes (M1).
  - The M3 rulings batch (allow-attribute policy, cli::main visibility, faithful-vs-fixed C bugs, forbid injection) — defaults are recorded in why.md D-keys; the session confirms them in one AskUserQuestion batch.
  - Any spend outside the pre-authorized envelope (see spend_surface).
  - Choosing whether the optional tuning rerun M9 runs (asked at the M8 gate).
  - Which run is final when a rerun scores differently (M9).
  - Supplying the course unsafe-metrics tool (M12), the validation script (M13), the Overleaf export (M14).
  - Merging and pushing: owner only, never a session.

spend_surface:
  - cmd: python3 -I MP4/src/run_pipeline.py --project project_N [--yes]
    cost: Claude Max subscription quota (no dollar cost). Up to 8 iterations x 60 turns of Opus per run; 2-4 h wall clock; may hit the 5-hour or 7-day window.
    authorization: PRE-AUTHORIZED 2026-10-28 by the owner (D7) within this envelope — at most 2 full runs (one per project), at most 2 tuning reruns, at most 3 smoke calls (--max-turns <= 2), max_iterations <= 8, max_turns <= 60 per iteration, model opus. Sessions announce each run with its estimate in the phase log but do not wait for a yes, and may auto-resume after a usage-limit pause. Anything beyond this envelope is an owner gate.
  - cmd: python3 -I MP4/src/run_pipeline.py --smoke --project project_N
    cost: subscription quota, <= 2 turns per call; 3 calls pre-authorized (M3).
  - cmd: /code-review ultra
    cost: billed separately; NEVER launched by a session.

tooling:
  checked: 2026-10-28
  candidates:
    - skill: code-review
      for: M5, M8, M11 (and the automatic close); run at max over MP4/src and MP4/configs; its --fix must never touch MP4/translations (provenance check catches it)
    - skill: simplify
      for: M5 optional cleanup of pipeline code only
    - skill: anthropic-skills:pdf
      for: M14 reading the Overleaf export (pypdf also works)
    - skill: security-review
      for: M5 — the pipeline spawns subprocesses and writes files from model output
    - tool: Workflow (ultracode)
      for: M8 and M10 — parallel readers over the two trajectories to mine repair examples; a judge picks the three for the report

external_boundary: Everything under MP4/ is grader-visible and graded; docs/programs/mp4/, .claude/commands/ and CLAUDE.md are internal process artifacts (visible in the repo but ungraded). The Overleaf report is the client-facing document.
clock: 2026-11-18 23:59 hard deadline (course). Internal cut-off 2026-11-15 for owner-blocked rows M12/M13 (D9). Start M6 by ~2026-11-05 to leave room for a rerun and quota pauses.
assumptions:
  - Allow-attributes: exactly one `#[allow(clippy::too_many_arguments)]` permitted on satc_is_separating_axis (fixed 8-parameter interface signature); all others forbidden. Based on the interface being immutable and the rubric counting warnings. Confirmed at the M3 gate.
  - libpsbt cli::main becomes `pub fn main() -> i32` with no extra bin target (minor addition; removes dead_code). Confirmed at the M3 gate.
  - C bugs not exercised by tests are translated faithfully where the C is well-defined and given defined, non-panicking behaviour where the C is UB; rulings written in configs/projects/*.yaml and README. Confirmed at the M3 gate.
  - Configs are YAML (PyYAML 6.0 is installed; the only Python dependency); prompts are Markdown; Python stays 3.9-compatible (host is 3.9.12).
  - Trajectories commit every run (including non-final tuning runs) as stream-json plus diagnostics; ~/.claude session copies are NOT committed; home paths rewritten to ~, secrets and emails scrubbed on write.
  - Report diagram is TikZ in the .tex plus Mermaid in README.
  - Ledger lives at docs/programs/mp4/ (skill default).
  - M1 re-fetches the CRUST-bench zip from https://github.com/anirudhkhatry/CRUST-bench (datasets/CRUST_bench.zip) and records its sha256, rather than relying on the session scratchpad copy.
  - The owner stays logged in to Claude (`claude auth status`) and keeps the Mac awake (caffeinate) during M3, M6, M7, M9 so paused runs can auto-resume.
